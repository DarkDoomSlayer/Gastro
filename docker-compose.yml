services:
  db:
    image: postgres:16-alpine
    container_name: gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastro_db
      POSTGRES_USER: gastro_user
      POSTGRES_PASSWORD: gastro_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d gastro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastro_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=django-insecure-gastro-costeo-dev-key-2026
      - DB_ENGINE=postgres
      - DB_NAME=gastro_db
      - DB_USER=gastro_user
      - DB_PASSWORD=gastro_password123
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gastro_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: gastro_cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on:
      - frontend

volumes:
  postgres_data:
