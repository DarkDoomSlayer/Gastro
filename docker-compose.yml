version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastro_password}
      POSTGRES_DB: ${POSTGRES_DB:-gastro_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gastro_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gastro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastro_user} -d ${POSTGRES_DB:-gastro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gastro_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://gastro_user:gastro_password@db:5432/gastro_db}
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-4000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gastro_network
    command: sh -c "npm install && npm run dev"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gastro_web
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - gastro_network
    command: sh -c "npm install && npm run dev"

volumes:
  gastro_pgdata:

networks:
  gastro_network:
    driver: bridge
